# Porta (PORT no Docker) e OpenAPI gerado a partir do código, em /openapi.json e /docs.
server.port=${PORT:8080}
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.meia.playgorithm=INFO
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs

# Uma linha por pedido no stdout, que o Docker mostra em `docker compose logs`.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%r -> %s (%{ms}T ms)
