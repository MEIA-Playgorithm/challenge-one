services:
  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    volumes:
      - ./frontend/public/config.json:/app/dist/config.json:ro

  knowledge-base:
    build: ./knowledge_base
    ports:
      - "8090:8090"
    environment:
      DATA_DIR: /data
    volumes:
      - ./knowledge_base:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/users.csv')"]
      interval: 2s
      timeout: 3s
      retries: 15

  swi-prolog:
    build:
      context: .
      dockerfile: swi-prolog/Dockerfile
    ports:
      - "8081:8080"
    environment:
      MOVIES_CSV: http://knowledge-base:8090/movies.csv
      USERS_CSV: http://knowledge-base:8090/users.csv
    depends_on:
      knowledge-base:
        condition: service_healthy
    init: true
